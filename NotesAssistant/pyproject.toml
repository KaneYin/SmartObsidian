[project]
name = "weft"
version = "0.0.1"
description = "Local-first agent over an Obsidian vault: local embeddings + Claude reasoning."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
weft = "weft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weft"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
